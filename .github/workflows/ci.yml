name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint application, core, infrastructure, and active evaluation code
        run: >-
          ruff check apps packages
          tests/evaluation/advisor_context_selection_eval.py
          tests/evaluation/freeze_context_quality_v1.py
          tests/evaluation/test_advisor_context_selection_eval.py
      - name: Run Python test suite
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --dir apps/web exec tsc --noEmit
      - name: Production build
        run: pnpm --dir apps/web build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: travelpilot
          POSTGRES_PASSWORD: travelpilot
          POSTGRES_DB: travelpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travelpilot -d travelpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      DATABASE_URL: postgresql+asyncpg://travelpilot:travelpilot@localhost:5432/travelpilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Apply all migrations to isolated PostgreSQL
        run: python -m alembic upgrade head
      - name: Verify persisted lodging survives context refresh and replan
        run: python scripts/verify_lodging_postgres_persistence.py
