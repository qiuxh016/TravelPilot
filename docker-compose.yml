services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: travelpilot
      POSTGRES_PASSWORD: travelpilot
      POSTGRES_DB: travelpilot
    ports:
      - "5432:5432"
    volumes:
      - travelpilot-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - travelpilot-redis:/data
  seaweedfs:
    image: chrislusf/seaweedfs:4.45
    profiles: [media]
    environment:
      AWS_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID:-travelpilot-dev-access}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-travelpilot-dev-secret-change-me}
      S3_BUCKET: ${MEDIA_S3_BUCKET:-travelpilot-media}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - travelpilot-media:/data

volumes:
  travelpilot-postgres:
  travelpilot-redis:
  travelpilot-media:

