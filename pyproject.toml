[project]
name = "travelpilot"
version = "0.1.0"
description = "Context-aware AI travel planning copilot"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<6.0",
  "httpx>=0.28,<1.0",
  "pillow>=11,<13",
  "boto3>=1.35,<2.0",
  "rapidocr>=3.10,<4",
  "onnxruntime>=1.20,<2",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.9,<1.0",
]

# The repository is a monorepo, so setuptools must not scan the repository
# root and mistake apps/packages/infra for one flat Python package.
[tool.setuptools]
packages = [
  "travelpilot_api",
  "travelpilot_api.api",
  "travelpilot_api.api.v1",
  "travelpilot_api.schemas",
  "travelpilot_api.advisor",
  "travelpilot_worker",
  "travelpilot_core",
  "travelpilot_core.agents",
  "travelpilot_core.application",
  "travelpilot_core.domain",
  "travelpilot_core.engines",
  "travelpilot_core.engines.constraints",
  "travelpilot_core.engines.geo",
  "travelpilot_core.engines.impact_analysis",
  "travelpilot_core.engines.optimizer",
  "travelpilot_core.ports",
  "travelpilot_infra",
  "travelpilot_infra.db",
  "travelpilot_infra.db.models",
  "travelpilot_infra.db.repositories",
  "travelpilot_infra.mcp",
  "travelpilot_infra.providers",
  "travelpilot_infra.providers.maps",
  "travelpilot_infra.providers.weather",
]

[tool.setuptools.package-dir]
travelpilot_api = "apps/api/src/travelpilot_api"
travelpilot_worker = "apps/worker/src/travelpilot_worker"
travelpilot_core = "packages/core/src/travelpilot_core"
"travelpilot_core.domain" = "packages/core/src/travelpilot_core/domain"
travelpilot_infra = "packages/infrastructure/src/travelpilot_infra"

[tool.setuptools.package-data]
travelpilot_core = ["skills/*/SKILL.md"]
travelpilot_infra = [
  "db/migrations/*.py",
  "db/migrations/README",
  "db/migrations/script.py.mako",
  "db/migrations/versions/*.py",
]

[tool.ruff.lint]
# FastAPI dependency declarations intentionally call Depends in defaults.
ignore = ["B008"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

